[package]
name = "h265_prime_decoder"
version = "0.1.0"
edition = "2024"

[lib]
name = "h265_prime_decoder"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
ffmpeg-next = { version = "8.1", features = ["codec", "format", "software-scaling"] }
rustler = "0.38"
membrane-dmabuf = "0.1.0"
libc = "0.2"
drm-fourcc = "2.2"

[features]
rpi = ["ffmpeg-next/rpi"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Development override until membrane-dmabuf 0.1.0 is published to crates.io.
[patch.crates-io]
membrane-dmabuf = { path = "../../../membrane_dmabuf/rust/membrane-dmabuf" }
ffmpeg-sys-next = { git = "https://github.com/Damirados/rust-ffmpeg-sys.git", branch = "cross-target-linking" }
