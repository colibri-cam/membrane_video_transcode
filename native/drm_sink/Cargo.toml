[package]
name = "drm_sink"
version = "0.1.0"
edition = "2024"

[lib]
name = "drm_sink"
crate-type = ["cdylib"]

[dependencies]
drm = "0.14"  # aka "drm-rs"
rustler = "0.36.2"
drm-ffi = "0.9"

[features]
default = []
verbose = []          # enable to keep println-style logs
rpi = []

[profile.release]
opt-level = "z"       # optimize for size
lto = "fat"           # best size (slower build)
codegen-units = 1
panic = "abort"
strip = "symbols"     # strip in Cargo (or run `strip -s` afterwards)
